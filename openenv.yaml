# What OpenEnv reads (openenv validate, openenv push).
spec_version: 1
name: inventorygym
type: space
runtime: fastapi
app: server.app:app
port: 8000

# The rest describes the environment for people; OpenEnv ignores it.
title: InventoryGym
version: "4.0.0"
author: BishnuGanguly
description: >
  An inventory-management environment for ordering policies: rules and
  language models. Every day the policy
  reads a stock report, and optionally insights about coming supplier delays and
  demand surges, and decides how much of each product to order. The products,
  storage areas and disruptions come from a world file (docs/world-files.md):
  a pharmaceutical warehouse is built in, a grocery store is an example, and
  anyone can describe their own inventory. Demand and lead times are noisy and
  the noise is drawn once per episode from the seed, so an episode never
  depends on the policy's actions. The policy never sees true demand or true
  lead times: it infers them from what it observes.

observation_space:
  type: structured_json
  description: >
    An InventoryState JSON object (docs/observation-and-answers.md).
    Global: current_date, storage pools with total and free capacity,
    expected_inbound_orders, insights visible today, waste today and cumulative,
    done, reward.
    Per product: inventory_on_hand, average demand (overall and last 5 days),
    average lead time and the last 3 observed, days of cover, storage pool,
    stockout_penalty, waste_penalty, demand fulfilled today and cumulative.
    Hidden from the policy: true demand, true lead times and the task's curves.

action_space:
  type: structured_json
  description: >
    A JSON object mapping product ids to order quantities, either as
    InventoryAction.orders or embedded in InventoryAction.message (raw LLM
    text; the first JSON object is extracted).
    Example: {"insulin": 100, "paracetamol": 500}. {} means no orders today.
  constraints:
    - quantities must be positive finite numbers; others are ignored
    - unknown product ids are ignored (matching is case-insensitive)
    - deliveries that exceed free capacity in their storage pool are wasted

reset_parameters:
  seed: "Fixes the episode (task generation and demand / lead-time noise)."
  task_name: "A task of the world (default world: the tasks listed below)."
  world: "A built-in world name or a world as JSON; never a file path."
  insights: "0 no insights (default), 1 exact wording, 2 natural wording."
  episode_config: "A full EpisodeConfig (JSON); overrides task_name."

endpoints:
  health: /health
  metadata: /metadata
  schema: /schema
  reset: /reset
  step: /step
  state: /state
  websocket: /ws
  dashboard: /dashboard/
  playground: /web

# Tasks of the built-in pharma world (worlds/pharma.yaml).
tasks:
  - id: supply_chain_broken
    description: >
      Flat demand. Insulin lead times step up 2-5x during days 15-25, then
      paracetamol lead times step up 2-5x during days 30-40.
    duration_days: 60
  - id: flu_season
    description: >
      Paracetamol demand follows a flu wave peaking at day 30 (up to 3x)
      while its lead times step up 2-5x during days 30-40.
    duration_days: 60
  - id: epidemic_two_wave
    description: >
      Hydroxychloroquine demand has two waves (day 17, and a larger one at
      day 45) with a supplier delay on days 17-27; insulin sees a mild rise
      and a delay around days 20-30.
    duration_days: 60
  - id: surprise_delays
    description: >
      Flat demand; two different products, drawn per seed, each have a supplier
      delay, the first starting on day 10-20 and the second on day 26-45.
      14 days of storage instead of 21.
    duration_days: 60
  - id: surprise_outbreak
    description: >
      A demand wave hits one product drawn per seed, peaking on day 30-38,
      while its supplier slows down around the peak. 14 days of storage.
    duration_days: 60
  - id: surprise_epidemic
    description: >
      Two demand waves for one product drawn per seed, with supplier delays,
      and a mild rise and a delay for a second product. 14 days of storage.
    duration_days: 60

scoring:
  step_reward_formula: >
    step_reward = stockout_penalty-weighted share of demand met today
                  - waste_fraction_today. Range [-1, 1]. See docs/scoring.md.
  final_score_formula: >
    final_score = clip(mean of the daily step rewards, 0, 1).
    Ordering nothing scores about 0.
