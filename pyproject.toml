[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventorygym"
dynamic = ["version"]
description = "An inventory-management environment for training and testing LLM agents on your own products, storage and disruptions (OpenEnv)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bishnu Ganguly" }]
keywords = ["openenv", "reinforcement-learning", "llm", "inventory", "supply-chain", "environment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # The OpenEnv runtime: FastAPI server, client types, the Playground at /web.
    "openenv-core[core]>=0.3.0",
    # The dashboard (server/dashboard.py): charts and the LLM agents.
    "plotly>=5.20",
    "openai>=1.0",
    # World files (world.py, worlds/*.yaml).
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Repository = "https://github.com/BishnuGanguly/InventoryGym"

[project.scripts]
# One command for everything: inventorygym serve | worlds | check | eval | teacher
inventorygym = "inventorygym.cli:main"
# The entry point OpenEnv looks for (uv run --project . server).
server = "inventorygym.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["inventorygym", "inventorygym.server", "inventorygym.training"]
package-dir = { "inventorygym" = ".", "inventorygym.server" = "server", "inventorygym.training" = "training" }

[tool.setuptools.dynamic]
version = { attr = "inventorygym.version.__version__" }

[tool.setuptools.package-data]
# The built-in world files (world.py loads worlds/<name>.yaml).
inventorygym = ["worlds/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
